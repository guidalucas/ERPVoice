<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Render de historia de Stocky</title>
<script type="module">
  import { renderAutoStory } from '/src/studio/autoStoryRender.ts';
  window.renderAutoStory = async payload => {
    const jpg = await renderAutoStory(payload);
    return Array.from(new Uint8Array(await jpg.arrayBuffer()));
  };
</script>
</html>
