nt-weight="400" fill="#273247">El preview se ajusta a la altura disponible; la exportación conserva 1080 × 1920.</text><text x="32" y="919" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#273247">En móvil: revisión compacta + controles agrupados. No borrar la referencia cuando se edita.</text></svg>