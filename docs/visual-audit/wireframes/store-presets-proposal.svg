<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img"><title>Tiendas: presets con diferencias útiles</title><desc>Comparación conceptual editorial, técnica y compacta manteniendo una sola configuración de marca.</desc><rect width="1440" height="960" fill="#f4f5f8"/><text x="32" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#5546d7">PROPUESTA CONCEPTUAL · NO IMPLEMENTADA · 22/10/2026</text><text x="32" y="82" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#273247">Tiendas: presets con diferencias útiles</text><rect x="24" y="120" width="452" height="642" rx="8" fill="#ffffff" stroke="#dce1ea"/><text x="44" y="157" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#273247">Editorial</text><text x="44" y="189" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#596579">Marca y colores del mismo negocio</text><path d="M44 208H456" fill="none" stroke="#dce1ea"/><rect x="44" y="226" width="412" height="162" rx="2" fill="#edf0f5" stroke="#edf0f5"/><text x="62" y="265" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#273247">Campaña breve</text><text x="62" y="297" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#273247">Imagen protagonista</text><rect x="62" y="322" width="154" height="44" rx="6" fill="#ffffff" stroke="#dce1ea"/><text x="78" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#273247">Explorar catálogo</text><rect x="44" y="420" width="198" height="174" rx="3" fill="#edf0f5" stroke="#edf0f5"/><text x="54" y="624" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#273247">Producto</text><text x="54" y="651" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#273247">Precio</text><rect x="258" y="420" width="198" height="174" rx="3" fill="#edf0f5" stroke="#edf0f5"/><text x="268" y="624" font-family="Arial,