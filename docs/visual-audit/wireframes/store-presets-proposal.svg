ily="Arial, sans-serif" font-size="12" font-weight="400" fill="#596579">Medida · Unidad</text><text x="514" y="725" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5546d7">Atributos que identifican</text><rect x="964" y="120" width="452" height="642" rx="8" fill="#ffffff" stroke="#dce1ea"/><text x="984" y="157" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#273247">Compacto</text><text x="984" y="189" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#596579">Marca y colores del mismo negocio</text><path d="M984 208H1396" fill="none" stroke="#dce1ea"/><text x="984" y="246" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#273247">Tu catálogo, a mano</text><rect x="984" y="269" width="412" height="44" rx="8" fill="#ffffff" stroke="#dce1ea"/><text x="998" y="297" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#596579">Buscar productos…</text><text x="984" y="344" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#273247">Categorías existentes · Filtros</text><rect x="984" y="380" width="128" height="90" rx="3" fill="#edf0f5" stroke="#edf0f5"/><text x="994" y="500" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#273247">Producto</text><text x="994" y="527" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#273247">Precio</text><rect x="1128" y="380" width="128" height="90" rx="3" fill="#edf0f5" stroke="#edf0f5"/><text x="1138" y="500" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#273247">Producto</text><text x="1138" y="527" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#273247">Precio</text><rect x="1272" y="380" width="128" height="90" rx="3" fill="#edf0f5" stroke="#edf0f5"/><text x="1282" y="500" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#273247">Producto</text><text x="1282" y="527" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#273247">Precio</text><text x="984" y="725" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5546d7">Explorar con menos recorrido</text><text x="32" y="812" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#273247">Misma personalización. Tres prioridades de composición.</text><text x="32" y="852" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#273247">Logo, banner, dos colores, fotos y textos se conservan. «Actual» sigue disponible.</text><text x="32" y="891" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#273247">Los estilos no restringen rubros. El comercio elige; Stocky protege contraste, lectura y selección.</text><text x="32" y="930" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#596579">Bloques grises = medios existentes, no fotos nuevas. Esquema para discutir proporciones, no diseño final.</text></svg>