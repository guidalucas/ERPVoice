name: Instagram schedule diagnostic
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check scheduled event
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          date -u
          printf '%s\n' "$EVENT_NAME" "$SCHEDULE"
